version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories: ["/server", "/go"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /py
    schedule:
      interval: weekly
