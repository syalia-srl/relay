name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
      - run: CGO_ENABLED=0 go build -o relay ./cmd/relay
        working-directory: server
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv run --python 3.12 --group conformance pytest conformance -q
        env:
          RELAY_BIN: ${{ github.workspace }}/server/relay
  py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: CGO_ENABLED=0 go build -o relay ./cmd/relay
        working-directory: server
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: give the tests a private address for ws:// (PROTOCOL.md 8.1)
        run: sudo ip addr add 10.255.0.1/32 dev lo
      - run: uv run --python 3.12 --group test pytest -q
        working-directory: py
        env:
          RELAY_BIN: ${{ github.workspace }}/server/relay
          RELAY_TEST_ADDR: 10.255.0.1
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: CGO_ENABLED=0 go build -o relay ./cmd/relay
        working-directory: server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: give the tests a private address for ws:// (PROTOCOL.md 8.1)
        run: sudo ip addr add 10.255.0.1/32 dev lo
      - run: npm ci
        working-directory: js
      - run: node --test
        working-directory: js
        env:
          RELAY_BIN: ${{ github.workspace }}/server/relay
          RELAY_TEST_ADDR: 10.255.0.1
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv run --python 3.12 --only-group vectors python vectors/tools/check_cacophony.py
      - run: uv run --python 3.12 --only-group vectors python -W ignore vectors/tools/generate.py --check
  golib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: CGO_ENABLED=0 go build -o relay ./cmd/relay
        working-directory: server
      - name: give the tests a private address for ws:// (PROTOCOL.md 8.1)
        run: sudo ip addr add 10.255.0.1/32 dev lo
      - run: go vet ./...
        working-directory: go
      - run: go test -race ./...
        working-directory: go
        env:
          RELAY_BIN: ${{ github.workspace }}/server/relay
          RELAY_TEST_ADDR: 10.255.0.1
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: CGO_ENABLED=0 go build -o relay ./cmd/relay
        working-directory: server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: give the tests a private address for ws:// (PROTOCOL.md 8.1)
        run: sudo ip addr add 10.255.0.1/32 dev lo
      - run: go test -race -run TestCrossLanguageMatrix -v .
        working-directory: go
        env:
          RELAY_BIN: ${{ github.workspace }}/server/relay
          RELAY_TEST_ADDR: 10.255.0.1
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: CGO_ENABLED=0 go build -o relay ./cmd/relay
        working-directory: server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: give the examples a private address for ws:// (PROTOCOL.md 8.1)
        run: sudo ip addr add 10.255.0.1/32 dev lo
      - name: run the three worked examples against the built relay
        run: uv run --python 3.12 python docs/tools/run_examples.py
        env:
          RELAY_BIN: ${{ github.workspace }}/server/relay
          RELAY_TEST_ADDR: 10.255.0.1
      - name: build the site and check its internal links
        run: uv run --python 3.12 --group docs python docs/tools/build.py
