[project]
name = "inbox-relay"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inbox_relay"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx"]
# The reference used to generate and check vectors/ (PROTOCOL.md section 12).
vectors = ["cryptography>=44", "noiseprotocol==0.3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
