[project]
name = "relay"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"

[dependency-groups]
# A black-box suite: it starts the Go binary and talks HTTP and WebSocket to it.
conformance = ["pytest", "pytest-asyncio", "httpx", "websockets", "cryptography>=44"]
# The reference used to generate and check vectors/ (PROTOCOL.md section 12).
vectors = ["cryptography>=44", "noiseprotocol==0.3.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["conformance"]
