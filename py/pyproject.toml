[project]
name = "relay-channel"
version = "0.1.0"
description = "Host and guest of the relay channel protocol (PROTOCOL.md, sections 3 to 9)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=44",
    "websockets>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[dependency-groups]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
